<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>にこっと</title>
 <style>
  body {
    text-align: center;
    font-family: sans-serif;
    margin: 0;
    background-color: #fff8dc;
    background-image: radial-gradient(white 40px, transparent 40px);
    background-size: 40px 40px;
  }

  h1 {
    font-size: 60px;
    margin-top: 200px;
  }

  #wrapper {
    position: relative;
    display: inline-block;
  }

  video, canvas {
    width: 640px;
    height: 480px;
    border-radius: 10px;
  }

  video {
    opacity: 0; /* カメラ映像を透明にする */
    position: absolute;
    pointer-events: none;
  }

  canvas {
    display: none;
  }

  /* ステータス文字 */
 #status {
  display: flex;
  flex-direction: column; /* ← 縦並びにする */
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: bold;
  margin-top: 20px;
}

  #smileGauge {
    width: 600px;
    height: 40px;
    margin-top: 30px;
  }

  #smileCounter {
    font-size: 20px;
    margin-top: 10px;
    font-weight: bold;
  }

  #downloadBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 8px;
    background-color: #4caf50;
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    z-index: 1000;
  }

  #downloadBtn:hover {
    background-color: #45a049;
  }

  /* 絵文字を中央に大きく配置 */
 #emojiDisplay {
  font-size: 80px;      /* 絵文字サイズを少し小さく */
  margin-bottom: 10px;  /* テキストとの間に余白 */
  opacity: 0;
  transition: opacity 0.5s ease;
}
</style>

</head>
<body>
  <h1>にこっと</h1>

  <div id="wrapper">
    <video id="video" autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="emojiDisplay">😊</div> 
  </div>

  <div id="status">カメラを起動中...</div>
  <progress id="smileGauge" value="0" max="2"></progress>
  <div id="smileCounter">今日の笑顔人数: 0</div>
  <button id="downloadBtn">CSVダウンロード</button>

  <!-- face-api.jsライブラリ -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <!-- 自作スクリプト -->
  <script type="module" src="script.js"></script>
</body>
</html>
