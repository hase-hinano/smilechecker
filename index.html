<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>スマイルチェッカー</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      background-color: #fff8dc;
      background-image: radial-gradient(white 40px, transparent 40px);
      background-size: 40px 40px;
    }
    h1 {
      font-size: 32px;
      margin-top: 20px;
    }
    #wrapper {
      position: relative;
      display: inline-block;
    }
    video, canvas {
      width: 640px;
      height: 480px;
      border-radius: 10px;
    }
video {
  opacity: 0; /* 透明にして見えなくする */
  position: absolute;
  pointer-events: none; /* クリックなど無効化 */
}


canvas {
  display: none;
}
    #status {
      font-size: 24px;
      margin-top: 10px;
      font-weight: bold;
    }
    #smileGauge {
      width: 400px;
      height: 22px;
      margin-top: 20px;
    }
    #smileCounter {
      font-size: 20px;
      margin-top: 10px;
      font-weight: bold;
    }
    #downloadBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 8px;
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
    #downloadBtn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>スマイルチェッカー</h1>

  <div id="wrapper">
    <video id="video" autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">カメラを起動中...</div>
  <progress id="smileGauge" value="0" max="2"></progress>
  <div id="smileCounter">今日の笑顔人数: 0</div>
  <button id="downloadBtn">CSVダウンロード</button>

  <!-- face-api.jsライブラリ -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <!-- 自作スクリプト -->
  <script type="module" src="script.js"></script>
</body>
</html>
